name: BitCider build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run addon contract tests
        run: npm test
      - name: Build frontend
        run: npm run build
      - name: Check server syntax
        run: node --check server.mjs
      - name: Check desktop relay syntax
        run: node --check bitcider-relay.mjs
      - name: Check published desktop relay syntax
        run: node --check public/bitcider-relay.mjs
      - name: Verify published relay matches backend source
        run: cmp --silent bitcider-relay.mjs public/bitcider-relay.mjs
      - name: Check Windows relay launcher presence
        run: test -s public/start-bitcider-relay.bat
      - name: Check Netlify gateway syntax
        run: node --check netlify/functions/backend-proxy.mjs
      - name: Check Cloudflare Worker syntax
        run: node --check cloudflare/worker.mjs
