name: BitCider CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run integration and regression tests
        run: npm test

      - name: Build production frontend
        run: npm run build

      - name: Verify product entry points
        run: |
          test -s dist/index.html
          test -s dist/bitmono/index.html
          test -s dist/bitconnection/index.html
