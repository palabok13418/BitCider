[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

# The SPA fallback only handles paths not claimed by the backend proxy function.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Apply the same baseline policy to every static frontend response.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; frame-src 'self' https://*.apple.com; script-src 'self' 'wasm-unsafe-eval' https://static.cloudflareinsights.com https://js-cdn.music.apple.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' http://127.0.0.1:10767 http://localhost:10767 https://*.apple.com https://*.itunes.apple.com; media-src 'self' blob: data: https://*.apple.com https://*.itunes.apple.com https://*.mzstatic.com; worker-src 'self' blob:; manifest-src 'self'"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    X-DNS-Prefetch-Control = "off"
    X-Permitted-Cross-Domain-Policies = "none"
    Strict-Transport-Security = "max-age=31536000"
